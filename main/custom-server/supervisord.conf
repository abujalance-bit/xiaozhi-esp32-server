[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid

[program:flask]
command=python /app/web/app.py
directory=/app/web
autostart=true
autorestart=true
startretries=5
startsecs=3
stdout_logfile=/var/log/supervisor/flask.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3
stderr_logfile=/var/log/supervisor/flask.err
stderr_logfile_maxbytes=20MB
priority=10
environment=PYTHONPATH="/app/web",DATA_DIR="%(ENV_DATA_DIR)s",SERVER_DATA_DIR="%(ENV_SERVER_DATA_DIR)s",FLASK_PORT="%(ENV_FLASK_PORT)s",WS_PORT="%(ENV_WS_PORT)s",HTTP_PORT="%(ENV_HTTP_PORT)s",SERVER_HOST="%(ENV_SERVER_HOST)s"

[program:xiaozhi-server]
; Delayed start — waits for Flask to write data/.config.yaml before launching.
; The 15-second delay gives Flask time to initialise and write the config file.
command=bash -c "sleep 15 && python /app/server/app.py"
directory=/app/server
autostart=true
autorestart=true
startretries=5
startsecs=10
stdout_logfile=/var/log/supervisor/server.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stderr_logfile=/var/log/supervisor/server.err
stderr_logfile_maxbytes=20MB
priority=20
