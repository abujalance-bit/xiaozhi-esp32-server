name: xiaozhi-custom

services:
  custom-server:
    build:
      context: ..          # main/ is the build context
      dockerfile: custom-server/Dockerfile
      args:
        # Find your local tag: docker images | grep framepack
        BASE_IMAGE: dustynv/framepack:r36.4.0
    image: xiaozhi-custom-server:latest
    restart: unless-stopped
    network_mode: host     # Ollama at localhost:11434, all ports bind on 0.0.0.0
    runtime: nvidia        # explicit, even though default-runtime is already nvidia
    volumes:
      - custom-data:/app/data
      - custom-server-data:/app/server/data
      # Host model directory — no re-download needed, shared with other containers
      - /data/models:/data/models:ro
    environment:
      # Set to your Jetson's LAN IP so ESP32 devices know where to connect
      SERVER_HOST: ${SERVER_HOST:-localhost}
      FLASK_PORT: "5001"
      WS_PORT: "8000"
      HTTP_PORT: "8003"
      DATA_DIR: /app/data
      SERVER_DATA_DIR: /app/server/data
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility

volumes:
  custom-data:
  custom-server-data:
