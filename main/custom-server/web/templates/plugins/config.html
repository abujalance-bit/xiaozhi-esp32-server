{% extends "base.html" %}
{% block title %}Configure {{ plugin.name }} — Xiaozhi Server{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-4">
  <a href="{{ url_for('plugins.list_plugins') }}" class="btn btn-sm btn-outline-secondary me-3">
    <i class="bi bi-arrow-left"></i>
  </a>
  <h2 class="fw-bold mb-0">
    <i class="bi bi-puzzle me-2 text-warning"></i>{{ plugin.name }}
  </h2>
</div>

<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="card border-0 bg-dark-subtle">
      <div class="card-body p-4">
        <p class="text-muted">{{ plugin.description }}</p>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label fw-semibold">Configuration (JSON)</label>
            <textarea name="params_json" class="form-control font-monospace" rows="12" id="paramsJson">{{ plugin.params_json | tojson(indent=2) }}</textarea>
            <div class="form-text">Edit the JSON configuration for this plugin.</div>
          </div>
          <div class="d-flex gap-2 justify-content-end">
            <a href="{{ url_for('plugins.list_plugins') }}" class="btn btn-outline-secondary">Cancel</a>
            <button type="submit" class="btn btn-warning">
              <i class="bi bi-check2 me-1"></i>Save Configuration
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
