{% extends "base.html" %}
{% block title %}Setup — Xiaozhi Server{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow-lg border-primary">
      <div class="card-body p-5">
        <div class="text-center mb-4">
          <i class="bi bi-shield-lock-fill text-primary" style="font-size:3rem"></i>
          <h3 class="mt-2 fw-bold">First-Run Setup</h3>
          <p class="text-muted small">Create your admin account</p>
        </div>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" name="username" class="form-control" value="admin" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label">Password <small class="text-muted">(min 8 chars)</small></label>
            <input type="password" name="password" class="form-control" required>
          </div>
          <div class="mb-4">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirm" class="form-control" required>
          </div>
          <button type="submit" class="btn btn-success w-100">
            <i class="bi bi-check2-circle me-1"></i>Create Account
          </button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
